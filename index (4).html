<html lang="tr">
<head>

<style>
:root{--bg:#050505;--bg2:#0B0B0D;--card:#111114;--el:#17171B;--tx:#fff;--mu:#A1A1AA;--bd:#27272A;--up:#34D399;--dn:#F87171;--ac:#E5E7EB;color-scheme:dark}

body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--bg2);border-right:1px solid var(--bd);padding:20px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:4px;z-index:30;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;letter-spacing:.14em}
.brand small{display:block;font-size:8px;color:var(--mu);letter-spacing:.2em;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mu);text-align:left;width:100%;min-height:44px;transition:.2s}
.nav:hover{background:var(--el);color:#fff}.nav.on{background:#fff;color:#000;font-weight:600}
main{--px:28px;margin-left:236px;flex:1;min-width:0;padding:0 var(--px) 40px}
header{display:flex;align-items:center;gap:12px;padding:18px 0;position:sticky;top:0;background:rgba(5,5,5,.9);backdrop-filter:blur(10px);z-index:20}
header h1{font-size:22px;flex:1}
.burger{display:none}
.in{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;min-height:42px;outline:0}

.search{max-width:260px}
.btn{background:#fff;color:#000;border-radius:12px;padding:10px 16px;font-weight:600;min-height:42px;transition:.15s}

.ic{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;position:relative}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--dn)}
.badge{border:1px solid var(--bd);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--mu);white-space:nowrap}
.badge i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-right:6px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;transition:.2s;animation:fade .3s}
.card:hover{border-color:#3f3f46}.card.gl{background:rgba(23,23,27,.7);backdrop-filter:blur(12px)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.big{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{padding:5px 10px;border-radius:8px;color:var(--mu);font-size:12px}.tabs .on{background:#fff;color:#000}
.qa{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.qa button{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:76px;transition:.2s}
.qa button:hover{background:var(--el);transform:translateY(-2px)}
.tr{display:grid;grid-template-columns:2fr 1fr 1.2fr 1.2fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.tr.h{color:var(--mu);font-size:12px}
.mk{grid-template-columns:.4fr 2fr 1.2fr 1fr 1.3fr 1.3fr 90px}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;background:var(--el);border:1px solid var(--bd)}
.coin{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
.warn{background:var(--el);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mu);margin-top:12px}
.err{color:var(--dn);font-size:12px;margin-top:6px;min-height:16px}
.pop{position:absolute;right:0;top:50px;width:320px;background:var(--el);border:1px solid var(--bd);border-radius:16px;padding:12px;z-index:40;box-shadow:0 20px 50px #000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:12px;font-weight:600;z-index:90}
.ccard{aspect-ratio:1.586;max-width:380px;border-radius:20px;padding:22px;background:linear-gradient(135deg,#1c1c20,#050505 60%,#222);border:1px solid #3f3f46;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 40px #000;transition:.3s}
.ccard.fz{filter:grayscale(1) brightness(.5)}
.bar{height:8px;border-radius:4px;background:#fff}
svg{max-width:100%}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .l{background:#000;display:grid;place-items:center;border-right:1px solid var(--bd);padding:30px;text-align:center}
.login .r{display:grid;place-items:center;padding:24px}
.sk{background:linear-gradient(90deg,var(--card),var(--el),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:80px}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:1024px){.g2,.g3{grid-template-columns:1fr}.qa{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;--px:14px;padding:0 14px 40px}.burger{display:grid}.search{display:none}.login{grid-template-columns:1fr}.login .l{display:none}
.tr,.mk{grid-template-columns:1fr 1fr;row-gap:4px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}.tr.h{display:none}.big{font-size:32px}.hm{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{font-feature-settings:"tnum","cv11";-webkit-font-smoothing:antialiased}
.card{background:linear-gradient(180deg,#141418,#0E0E11);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.4)}
.card.gl{background:linear-gradient(135deg,rgba(30,30,36,.85),rgba(12,12,15,.9))}
header{border-bottom:1px solid var(--bd);margin:0 calc(-1*var(--px)) 22px;padding:14px var(--px)}
header h1{font-size:18px;letter-spacing:.01em}
.nav.on{box-shadow:0 4px 18px rgba(255,255,255,.12)}
.tr:not(.h){transition:background .15s}.tr:not(.h):hover{background:rgba(255,255,255,.03)}
.pill.ok{color:var(--up);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi span{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{font-size:22px;letter-spacing:-.01em}
.ucard{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin:8px 0}
.av{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:12px}
.foot{margin-top:36px;padding-top:18px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#27272A;border-radius:6px}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){header{padding:12px var(--px)}}
</style>

['BTC','Bitcoin',67000,2.4,11.2,1.32e12,3.1e10,'İlk ve en büyük kripto para birimi; merkeziyetsiz, sınırlı arzlı dijital değer saklama aracı.'],

const cp=s=>s==='USD'?1:COINS.find(c=>c.s===s).p;

const seed0=()=>({bal:{USD:12450.75,BTC:0.4215,ETH:3.2,SOL:25,XRP:1500,USDT:2000,BNB:4},fav:['BTC','ETH'],frozen:false,hide:false,cardHide:true,
tx:[
{id:1005,t:'Buy',a:'BTC',q:0.05,u:3350,d:Date.now()-864e5*1,s:'Completed'},

let live=false,liveT='',aper='W';const DEMO0=COINS.map(c=>({p:c.p,c:c.c}));

try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+Object.values(IDS).join(',')+'&vs_currencies=usd&include_24hr_change=true',{signal:ac.signal});
if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
const nv=COINS.map(c=>{const d=j[IDS[c.s]];if(!d||typeof d.usd!=='number')throw new Error('Eksik veri');return [d.usd,+(d.usd_24h_change||0)]});
COINS.forEach((c,i)=>{c.p=nv[i][0];c.c=nv[i][1]});live=true;liveT=new Date().toLocaleTimeString('tr-TR');render();if(!silent)toast('Canlı fiyat bağlandı (CoinGecko)')}

try{if(window.supabase&&CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY)sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}catch(e){}

function line(v,w,h,col){const mn=Math.min(...v),mx=Math.max(...v),sp=mx-mn||1;

const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');

let reg=false;

return `<div class="app"><aside id="sb"><div class="brand">${LOGO(34)}<div>REAPER<small>BANK</small></div></div>

if(k==='swap')modal(head('Swap')+f('m1','Gönder')+`<select id="m1" class="in">${opts(AS(),'ETH')}</select><button class="btn g sm" style="margin-top:8px" data-a="flip">⇅ Ters çevir</button>`+f('m3','Al')+`<select id="m3" class="in">${opts(AS(),'BTC')}</select>`+f('m2','Miktar')+`<input id="m2" class="in" type="number" min="0" step="any"><div class="mu" id="pv" style="margin-top:8px"></div><div class="err" id="me"></div><button class="btn" style="width:100%" data-a="do" data-k="swap">Onayla</button>`);
if(k==='send')modal(head('Send')+f('m1','Varlık')+`<select id="m1" class="in">${opts(AS().filter(x=>x!=='USD'),'BTC')}</select>`+f('m3','Alıcı adresi (yalnızca arayüzde kullanılır)')+`<input id="m3" class="in" maxlength="80" autocomplete="off">`+f('m2','Tutar')+`<input id="m2" class="in" type="number" min="0" step="any"><div class="mu" id="pv" style="margin-top:8px"></div><div class="err" id="me"></div><button class="btn" style="width:100%" data-a="do" data-k="send">Onayla</button>`);
if(k==='recv'){modal(head('Receive')+f('m1','Coin')+`<select id="m1" class="in">${opts(C.filter(x=>x!=='USDT').concat('USDT'))}</select><div id="qr" style="margin:14px 0"></div><div class="row"><code id="ad" style="word-break:break-all;flex:1"></code><button class="btn g sm" data-a="copy">Kopyala</button></div><p class="mu" style="margin-top:8px" id="net"></p><p class="warn">Bu adres ve QR görseli ÖRNEKTİR (taranamaz). Buraya gerçek varlık göndermeyin.</p>`);recv()}
}
function recv(){const s=$('#m1').value,a=addr(s);$('#ad').textContent=a;$('#net').textContent='Ağ: '+(s==='BTC'?'Bitcoin':s==='ETH'||s==='USDT'?'Ethereum (ERC-20)':s)+' · DEMO';
const r=rng([...a].reduce((x,c)=>x+c.charCodeAt(0),7)),n=21;let c='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const fin=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(fin?(x%6==0||y%6==0||(x%6>1&&x%6<5&&y%6>1&&y%6<5)):r()>.5)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
$('#qr').innerHTML=`<svg width="150" height="150" viewBox="-1 -1 23 23" style="background:#fff;padding:6px;border-radius:12px" fill="#000" aria-label="Örnek QR (demo, taranamaz)">${c}</svg>`}
function preview(){const k=$('#m1'),a=+($('#m2')||{}).value;if(!$('#pv')||!k)return;const s=k.value;let t='';
if(!(a>0)){$('#pv').textContent='';return}
const m=$('.modal').innerText;
if(m.includes('Buy Crypto'))t=`Tahmini: ${(a*(1-FEE)/cp(s)).toFixed(6)} ${s} · Komisyon ${money(a*FEE)}`;
else if(m.includes('Sell Crypto'))t=`Tahmini: ${money(a*cp(s)*(1-FEE))} · Komisyon ${money(a*cp(s)*FEE)}`;
else if(m.includes('Swap')){const d=$('#m3').value;t=`Tahmini: ${(a*cp(s)/cp(d)*(1-FEE)).toFixed(6)} ${d} · Oran 1 ${s} = ${(cp(s)/cp(d)).toFixed(6)} ${d}`}
else t=`≈ ${money(a*cp(s))}`;$('#pv').textContent=t}
function doAct(k){const E=m=>{$('#me').textContent=m},v=id=>$(id)&&$(id).value,a=+v('#m2'),b=S.bal;
if(k==='add'){const x=+v('#m1');if(!(x>0))return E('Geçerli bir tutar girin.');b.USD+=x;addTx('Receive','USD',x,x,'Demo bakiye eklendi');}
else{const s=v('#m1');if(!(a>0))return E('Geçerli bir miktar girin.');
if(k==='buy'){if(a>b.USD)return E('Yetersiz USD bakiyesi.');const q=a*(1-FEE)/cp(s);b.USD-=a;b[s]+=q;addTx('Buy',s,+q.toFixed(6),a,'Demo alış: '+q.toFixed(6)+' '+s)}
if(k==='sell'){if(a>b[s])return E('Yetersiz '+s+' bakiyesi.');const u=a*cp(s)*(1-FEE);b[s]-=a;b.USD+=u;addTx('Sell',s,a,u,'Demo satış: '+a+' '+s)}
if(k==='swap'){const d=v('#m3');if(s===d)return E('Farklı varlıklar seçin.');if(a>b[s])return E('Yetersiz '+s+' bakiyesi.');const q=a*cp(s)/cp(d)*(1-FEE);b[s]-=a;b[d]+=q;addTx('Swap',s,a,a*cp(s),'Demo swap: '+s+' → '+d)}
if(k==='send'){const ad=v('#m3').trim();if(!/^[A-Za-z0-9\-]{10,80}$/.test(ad))return E('Geçersiz adres (10-80 harf/rakam/tire).');if(a>b[s])return E('Yetersiz '+s+' bakiyesi.');b[s]-=a;addTx('Send',s,a,a*cp(s),'Demo gönderim: '+a+' '+s)}}
for(const x in b)b[x]=Math.max(0,+b[x].toFixed(8));save();closeM();toast('Demo işlem tamamlandı');render()}

/* ---------- CORE ---------- */
function render(){const r=$('#root');if(!auth){r.innerHTML=loginView();return}
r.innerHTML=shell();$('#view').innerHTML=V[page]();
if(page==='markets'){marketList();$('#ms').oninput=marketList;$('#mo').onchange=e=>{sortK=e.target.value;marketList()}}
if(page==='transactions'){txList();['ts','tt','tc','td'].forEach(i=>$('#'+i).addEventListener('input',txList))}
const svg=$('#pc');if(svg){svg.onpointermove=e=>{const bx=svg.getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-bx.left)/bx.width)),i=Math.round(f*(window._cv.length-1)),dt=new Date(Date.now()-(1-i/(window._cv.length-1))*window._cd*864e5);$('#tip').innerHTML=`${dt.toLocaleDateString('tr-TR')} — <b style="color:#fff">${money(window._cv[i])}</b> <span class="pill">demo</span>`}}
$('#gs').oninput=e=>{if(e.key!=='x'&&e.target.value&&page!=='markets'){page='markets';render();$('#ms').value=e.target.value;marketList();}}}
function csv(){const rows=[['ID','Tür','Varlık','Miktar','USD','Tarih','Durum']].concat(S.tx.map(t=>[t.id,t.t,t.a,t.q,t.u.toFixed(2),new Date(t.d).toISOString(),t.s]));
const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='reaper-demo-islemler.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t){if(pop&&!e.target.closest('.pop')){pop=null;render()}return}
const a=t.dataset.a;if(a==='coin'&&e.target.closest('[data-a="fav"]'))return;
const A={
go(){page=t.dataset.p;pop=null;$('#sb')&&$('#sb').classList.remove('open');render()},sb(){$('#sb').classList.toggle('open')},
hide(){S.hide=!S.hide;save();render()},range(){range=t.dataset.r;render()},act(){act(t.dataset.k)},close:closeM,do(){doAct(t.dataset.k)},
flip(){const x=$('#m1').value;$('#m1').value=$('#m3').value;$('#m3').value=x;preview()},
copy(){navigator.clipboard.writeText($('#ad').textContent).then(()=>toast('Demo adres kopyalandı'),()=>toast('Kopyalama başarısız'))},
fav(){const s=t.dataset.s;S.fav=S.fav.includes(s)?S.fav.filter(x=>x!==s):S.fav.concat(s);save();marketList()},
sortd(){sortD*=-1;marketList()},csv,
coin(){const c=COINS.find(x=>x.s===t.dataset.s),v=series(40,c.p,.05,c.s.charCodeAt(0)*11,c.c>=0?.003:-.003);modal(head(c.n+' ('+c.s+')')+`<div class="big" style="font-size:30px;margin-top:8px">${money(c.p,c.p<10?3:0)}</div>${chg(c.c)} <span class="pill">${live?'Canlı fiyat · grafik simülasyon':'DEMO veri'}</span><svg viewBox="0 0 400 140" width="100%" style="height:140px;margin:12px 0" preserveAspectRatio="none">${line(v,400,140,c.c>=0?'#34D399':'#F87171')}</svg><p class="mu">${c.d}</p><p class="mu" style="margin-top:6px">Piyasa değeri ${money(c.cap/1e9,1)}B · Hacim ${money(c.vol/1e9,1)}B</p>`)},
txd(){const x=S.tx.find(y=>y.id==t.dataset.id);modal(head('İşlem #'+x.id)+`<p>Tür: <b>${esc(x.t)}</b></p><p>Varlık: ${esc(x.a)}</p><p>Miktar: ${x.q}</p><p>Tutar: ${money(x.u)}</p><p>Tarih: ${new Date(x.d).toLocaleString('tr-TR')}</p><p>Durum: ${esc(x.s)}</p>`)},
notif(){pop=pop==='n'?null:'n';render()},prof(){pop=pop==='p'?null:'p';render()},
readall(){S.notif.forEach(n=>n.r=1);save();render()},
cardhide(){S.cardHide=!S.cardHide;save();render()},freeze(){S.frozen=!S.frozen;save();render()},
addcard(){modal(head('Kart ekle')+`<p class="mu" style="margin:10px 0">Demo: gerçek kart numarası girmeyin. Gerçek kart çıkarma bu arayüzde yoktur.</p><label for="cn">Kart adı</label><input id="cn" class="in" maxlength="30"><button class="btn" style="width:100%;margin-top:14px" data-a="close">Tamam (demo)</button>`)},
saveset(){toast('Tercihler kaydedildi (demo)')},
reset(){S=seed0();save();render();toast('Demo verileri sıfırlandı')},
async logout(){pop=null;guest=false;if(sb&&user){try{await sb.auth.signOut()}catch(e){}}user=null;auth=false;render()},async oauth(){if(!sb)return toast('Kimlik doğrulama yapılandırılmadı (config.js)');const r=await sb.auth.signInWithOAuth({provider:t.dataset.p,options:{redirectTo:location.origin+location.pathname}});if(r.error)toast(r.error.message)},async forgot(){e.preventDefault();if(!sb)return toast('Kimlik doğrulama yapılandırılmadı');const em=$('#em').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return $('#le').textContent='Önce e-posta adresinizi girin.';const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});toast(r.error?r.error.message:'Sıfırlama e-postası gönderildi')},
live(){setLive(!live)},aper(){aper=t.dataset.v;render()},guest(){e.preventDefault();guest=true;auth=true;page='overview';render()},togreg(){e.preventDefault();reg=!reg;render()},
showpw(){const p=$('#pw');p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'Göster':'Gizle'}};
A[a]&&A[a]()});
document.addEventListener('input',e=>{if(e.target.closest('.modal')){const id=e.target.id;if(id==='m1'&&$('#qr'))recv();else preview()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(pop){pop=null;render()}}});
async function doLogin(){const E=m=>{$('#le').textContent=m};if(!sb)return E('Kimlik doğrulama yapılandırılmadı (config.js).');
const em=$('#em').value.trim(),pw=$('#pw').value;
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return E('Geçerli bir e-posta girin.');
if(pw.length<8)return E('Şifre en az 8 karakter olmalı.');
E('');try{if(reg){const r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)return E(r.error.message);if(!r.data.session)return E('Doğrulama e-postası gönderildi. E-postanızı onaylayıp giriş yapın.')}
else{const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)return E(r.error.message)}}catch(e){E('Bağlantı hatası: '+e.message)}}
document.addEventListener('click',e=>{if(e.target.closest('[data-a="login"]'))doLogin()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#lf'))doLogin()});
if(sb){sb.auth.getSession().then(r=>{const x=r.data&&r.data.session;user=x?x.user:null;auth=!!x;render()}).catch(()=>render());
sb.auth.onAuthStateChange((ev,x)=>{if(guest)return;const was=auth;user=x?x.user:null;auth=!!x;if(auth!==was){if(auth)page='overview';render()}})}
render();
